name: Worker Image

"on":
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "docker/worker/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/${REPO}-worker" >> "$GITHUB_OUTPUT"
          echo "package=${REPO}-worker" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## Worker image"
            echo ""
            echo "- \`${{ steps.image.outputs.name }}:main\`"
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}\`"
            echo ""
            echo "If RunPod cannot pull this image, ensure the package is public or configure registry auth in Vercel (\`GHCR_USERNAME\`/\`GHCR_TOKEN\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Best-effort: make GHCR package public
        continue-on-error: true
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.image.outputs.package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          HDR_A="Accept: application/vnd.github+json"
          HDR_V="X-GitHub-Api-Version: 2022-11-28"
          HDR_T="Authorization: Bearer ${GH_TOKEN}"
          BODY='{"visibility":"public"}'

          echo "Attempting org-level visibility update (may 404 for user owners)..."
          curl -sS -o /dev/null -w "%{http_code}\n" -X PATCH \
            -H "$HDR_A" -H "$HDR_V" -H "$HDR_T" \
            "${API}/orgs/${OWNER}/packages/container/${PACKAGE}/visibility" \
            -d "$BODY" || true

          echo "Attempting user-level visibility update..."
          curl -sS -o /dev/null -w "%{http_code}\n" -X PATCH \
            -H "$HDR_A" -H "$HDR_V" -H "$HDR_T" \
            "${API}/user/packages/container/${PACKAGE}/visibility" \
            -d "$BODY" || true

  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile worker
        run: python -m compileall worker
